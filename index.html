<!doctype html>
<html lang="en-AU">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bamboo chimes</title>
    <meta
      name="description"
      content="A wind chime you play with a mouse, a finger or a keyboard — seven bamboo tubes over an ink-wash grove, tuned to a five-tone scale."
    />

    <!--
      The link-preview card: public/card.png, 1200x630 --- replace it. The URL
      resolves against this page, like any link. No og:title/og:description:
      scrapers fall back to the <title> and description above.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:image" content="./card.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header>
      <nav aria-label="Primary">
        <a href="./">Bamboo chimes</a>
      </nav>
    </header>
    <main>
      <h1>Bamboo chimes</h1>
      <p class="hint">
        Click, drag, or touch a tube to strike it. Tab and press Enter or Space to
        play by keyboard.
      </p>
      <div class="grove" id="grove" aria-label="Seven bamboo chimes, tuned to a five-tone scale" role="group">
        <div class="beam" aria-hidden="true"></div>
        <!-- Tube length follows pitch (length ∝ 1/√frequency): lowest note on
             the left is the longest tube, stepping down to the highest. -->
        <button class="chime" type="button" data-note="0" style="--h: 100%" aria-label="Chime 1 of 7, lowest tone"></button>
        <button class="chime" type="button" data-note="1" style="--h: 94%" aria-label="Chime 2 of 7"></button>
        <button class="chime" type="button" data-note="2" style="--h: 87%" aria-label="Chime 3 of 7"></button>
        <button class="chime" type="button" data-note="3" style="--h: 82%" aria-label="Chime 4 of 7, middle tone"></button>
        <button class="chime" type="button" data-note="4" style="--h: 75%" aria-label="Chime 5 of 7"></button>
        <button class="chime" type="button" data-note="5" style="--h: 71%" aria-label="Chime 6 of 7"></button>
        <button class="chime" type="button" data-note="6" style="--h: 65%" aria-label="Chime 7 of 7, highest tone"></button>
      </div>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
